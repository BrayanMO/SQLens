<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQLens - Login</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-color);
        }
        
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .login-logo {
            margin-bottom: 30px;
            animation: fadeInDown 0.8s ease;
        }

        .login-logo .icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 10px;
        }

        .login-logo h1 {
            font-size: 2.5rem;
            margin: 0;
            background: linear-gradient(135deg, #a8b1ff, #7f52ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-logo p {
            color: var(--text-secondary);
            margin-top: 5px;
            font-size: 0.95rem;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            animation: fadeInUp 0.8s ease;
        }

        .login-form input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px;
            font-size: 1rem;
            border-radius: 12px;
            color: var(--text-color);
            transition: all 0.3s ease;
            text-align: center;
            letter-spacing: 2px;
        }

        .login-form input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(127, 82, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .login-form button {
            padding: 15px;
            font-size: 1rem;
            font-weight: 600;
            margin-top: 10px;
        }

        #login-error {
            color: #ff4d4d;
            font-size: 0.9rem;
            min-height: 20px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <!-- Background elements for glassmorphism Glow -->
    <div class="bg-shape shape-1" style="width: 500px; height: 500px; top: -100px; left: -100px;"></div>
    <div class="bg-shape shape-2" style="width: 600px; height: 600px; bottom: -200px; right: -100px;"></div>

    <div class="login-container glass-panel">
        <div class="login-logo">
            <span class="icon">🔍</span>
            <h1>SQLens</h1>
            <p>Acceso seguro para Analistas N3</p>
        </div>
        
        <form class="login-form" id="login-form">
            <input type="password" id="password" placeholder="Contraseña Maestra" required autocomplete="current-password">
            <div id="login-error">Contraseña incorrecta</div>
            <button type="submit" class="btn primary glowing-btn" id="btn-login">Ingresar al Sistema</button>
        </form>
    </div>

    <script src="/js/login.js"></script>
</body>
</html>
